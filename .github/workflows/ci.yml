name: CI

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel:
    name: Panel (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: swifty
          POSTGRES_PASSWORD: swifty
          POSTGRES_DB: swifty
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v3

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: just lint panel

      - name: Typecheck
        run: just typecheck panel

      - name: Migrate database
        run: just migrate
        env:
          DATABASE_URL: postgres://swifty:swifty@localhost:5432/swifty

      - name: Test
        run: just test panel
        env:
          DATABASE_URL: postgres://swifty:swifty@localhost:5432/swifty

      - name: Build
        run: just build panel

  daemon:
    name: Daemon (vet, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v3

      - uses: actions/setup-go@v7
        with:
          go-version-file: daemon/go.mod
          # No go.sum yet (stdlib-only daemon); switch to
          # cache-dependency-path: daemon/go.sum once dependencies exist.
          cache: false

      - name: Lint (gofmt + vet)
        run: just lint daemon

      - name: Test
        run: just test daemon

      - name: Build
        run: just build daemon
