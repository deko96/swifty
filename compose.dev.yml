# Development dependencies only (PostgreSQL + Redis).
# Swifty itself never requires Docker — see ARCHITECTURE.md.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: swifty
      POSTGRES_PASSWORD: swifty
      POSTGRES_DB: swifty
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

volumes:
  pgdata:
